<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mr. Morale & The Big Steppers | Editorial</title>

    <meta name="description"
        content="An interactive editorial exploring Kendrick Lamar's Mr. Morale & The Big Steppers.">

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <!-- ===================================================== -->
    <!-- Loading Screen -->
    <!-- ===================================================== -->

    <div id="loader">

        <div class="loader-content">

            <h1>Mr. Morale & The Big Steppers</h1>

            <p>An Interactive Editorial</p>

        </div>

    </div>

    <!-- ===================================================== -->
    <!-- Sidebar -->
    <!-- ===================================================== -->

    <aside id="sidebar">

        <div class="sidebar-header">

            <h2>TRACKLIST</h2>

            <button id="closeSidebar"
                aria-label="Close Navigation">

                ✕

            </button>

        </div>

        <nav id="trackList">

            <!-- Generated by script.js -->

        </nav>

        <div class="sidebar-footer">

            <div id="progressText">

                Chapter 1 / 20

            </div>

            <div class="progressBar">

                <div id="progressFill"></div>

            </div>

        </div>

    </aside>

    <!-- ===================================================== -->
    <!-- Sidebar Toggle -->
    <!-- ===================================================== -->

    <button id="menuButton"
        aria-label="Open Navigation">

        ☰

    </button>

    <!-- ===================================================== -->
    <!-- HUD -->
    <!-- ===================================================== -->

    <header id="hud">

        <div class="album">

            <h1>

                Mr. Morale<br>
                & The Big Steppers

            </h1>

        </div>

        <div class="chapterInfo">

            <div id="chapterNumber">

                Chapter 01

            </div>

            <div id="chapterTitle">

                United in Grief

            </div>

        </div>

    </header>

    <!-- ===================================================== -->
    <!-- Main Viewer -->
    <!-- ===================================================== -->

    <main id="viewer">

        <!-- Chapters generated here -->

    </main>

    <!-- ===================================================== -->
    <!-- Controls -->
    <!-- ===================================================== -->

    <div id="controls">

        <span>↑↓ Chapters</span>

        <span>←→ Pages</span>

    </div>

    <!-- ===================================================== -->
    <!-- Fullscreen -->
    <!-- ===================================================== -->

    <button id="fullscreenButton"
        aria-label="Toggle Fullscreen">

        ⛶

    </button>

    <!-- ===================================================== -->
    <!-- Overlay -->
    <!-- ===================================================== -->

    <div id="overlay"></div>

    <!-- ===================================================== -->
    <!-- Main Script -->
    <!-- ===================================================== -->

    <script src="script.js"></script>

</body>

</html>
