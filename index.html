<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mr. Morale & The Big Steppers</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<header>
<h1>Mr. Morale & The Big Steppers</h1>
<p>An editorial analysis by Rohan Jose</p>
</header>

<div class="container"></div>

<script>

const container = document.querySelector(".container");

for(let i=1;i<=40;i++){

    const page=document.createElement("section");
    page.className="page";

    const img=document.createElement("img");

    img.src=`${String(i).padStart(2,'0')}.png`;
    img.loading="lazy";

    page.appendChild(img);

    container.appendChild(page);

}

const observer=new IntersectionObserver(entries=>{

    entries.forEach(entry=>{

        if(entry.isIntersecting){

            entry.target.classList.add("visible");

        }else{

            entry.target.classList.remove("visible");

        }

    });

},{
    threshold:.35
});

document.querySelectorAll(".page").forEach(p=>observer.observe(p));

</script>

</body>
</html>
