<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>
        Mr. Morale & the Big Steppers
    </title>

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <link
        rel="stylesheet"
        href="style.css">

</head>

<body>

    <!-- Loading Screen -->

    <div id="loader">

        <div class="loader-content">

            <h1>
                Mr. Morale &
                <br>
                the Big Steppers
            </h1>

            <p>
                Editorial Experience
            </p>

        </div>

    </div>



    <!-- Sidebar -->

    <aside id="sidebar">

        <header class="sidebar-header">

            <h2>Tracklist</h2>

            <button
                id="closeSidebar"
                aria-label="Close">

                ✕

            </button>

        </header>


        <nav id="trackList">

            <!-- Generated by JS -->

        </nav>


        <footer class="sidebar-footer">

            <div id="progressBar">

                <div id="progressFill"></div>

            </div>

            <div id="progressText">

                1 / 20

            </div>

        </footer>

    </aside>



    <!-- Background Overlay -->

    <div id="overlay"></div>



    <!-- HUD -->

    <header id="hud">

        <button
            id="menuButton"
            aria-label="Open menu">

            ☰

        </button>


        <div id="hudCenter">

            <div id="albumTitle">

                Mr. Morale & the Big Steppers

            </div>

            <div id="chapterTitle">

                Loading...

            </div>

        </div>


        <div id="chapterNumber">

            01

        </div>

    </header>



    <!-- Viewer -->

    <main id="viewer">

        <!--

            JavaScript renders
            ONE chapter here.

        -->

    </main>



    <!-- Bottom HUD -->

    <footer id="controls">

        <span>

            ↑ ↓ Songs

        </span>

        <span>

            ← → Pages

        </span>

        <span>

            Mouse Wheel • Trackpad • Touch

        </span>

    </footer>



    <!-- Fullscreen -->

    <button
        id="fullscreenButton"
        aria-label="Fullscreen">

        ⛶

    </button>



    <script src="script.js"></script>

</body>

</html>
