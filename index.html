<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>
        Mr. Morale & the Big Steppers
    </title>

    <link
        rel="stylesheet"
        href="style.css">

</head>

<body>

    <!-- Loading Screen -->

    <div id="loader">

        <div class="loader-content">

            <h1>Mr. Morale & the Big Steppers</h1>

            <p>Loading editorial...</p>

        </div>

    </div>



    <!-- Sidebar -->

    <aside id="sidebar">

        <header class="sidebar-header">

            <h2>Tracklist</h2>

            <button id="closeSidebar" aria-label="Close menu">
                ✕
            </button>

        </header>

        <nav id="trackList"></nav>

        <footer class="sidebar-footer">

            <div id="progress">

                <div id="progressFill"></div>

            </div>

            <span id="progressText">
                Chapter 1 / 20
            </span>

        </footer>

    </aside>



    <!-- Dark overlay when menu is open -->

    <div id="overlay"></div>



    <!-- Fixed HUD -->

    <header id="hud">

        <button
            id="menuButton"
            aria-label="Open menu">

            ☰

        </button>

        <div class="hud-center">

            <div id="albumTitle">
                Mr. Morale & the Big Steppers
            </div>

            <div id="chapterTitle">
                Loading...
            </div>

        </div>

        <div id="chapterNumber">

            Chapter 01

        </div>

    </header>



    <!-- Main Reader -->

    <main id="viewer"></main>



    <!-- Controls -->

    <div id="controls">

        <span>↑ ↓ Chapter</span>

        <span>← → Page</span>

        <span>F Fullscreen</span>

    </div>



    <!-- Fullscreen -->

    <button
        id="fullscreenButton"
        aria-label="Toggle fullscreen">

        ⛶

    </button>



    <script src="script.js"></script>

</body>

</html>
