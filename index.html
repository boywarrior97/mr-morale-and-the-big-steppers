<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>

        Mr. Morale & the Big Steppers

    </title>

    <meta
        name="theme-color"
        content="#050505">

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <link
        rel="stylesheet"
        href="style.css">

</head>

<body>

    <!--==================================================
    LOADER
    ==================================================-->

    <div id="loader">

        <div class="loader-content">

            <h1>

                Mr. Morale
                <br>
                & the Big Steppers

            </h1>

            <p>

                Editorial Reader

            </p>

        </div>

    </div>



    <!--==================================================
    SIDEBAR
    ==================================================-->

    <aside id="sidebar">

        <header class="sidebar-header">

            <h2>

                Tracklist

            </h2>

            <button
                id="closeSidebar"
                aria-label="Close menu">

                ✕

            </button>

        </header>

        <nav id="trackList">

            <!-- Generated -->

        </nav>

        <footer class="sidebar-footer">

            <div id="progressBar">

                <div id="progressFill"></div>

            </div>

            <div id="progressText">

                1 / 20

            </div>

        </footer>

    </aside>



    <!--==================================================
    OVERLAY
    ==================================================-->

    <div id="overlay"></div>



    <!--==================================================
    HUD
    ==================================================-->

    <header id="hud">

        <button
            id="menuButton"
            aria-label="Open menu">

            ☰

        </button>

        <div id="hudCenter">

            <div id="albumTitle">

                Mr. Morale & the Big Steppers

            </div>

            <div id="chapterTitle">

                Loading...

            </div>

        </div>

        <div id="chapterNumber">

            01

        </div>

    </header>



    <!--==================================================
    VIEWER
    ==================================================-->

    <main id="viewer">

        <!--

            JavaScript creates
            the chapter stack here.

            Previous
            Current
            Next

        -->

    </main>



    <!--==================================================
    BOTTOM BAR
    ==================================================-->

    <footer id="controls">

        <button
            id="previousChapterButton"
            aria-label="Previous song">

            ↑

        </button>

        <button
            id="previousPageButton"
            aria-label="Previous page">

            ←

        </button>

        <button
            id="toggleHUDButton"
            aria-label="Toggle interface">

            ⊙

        </button>

        <button
            id="nextPageButton"
            aria-label="Next page">

            →

        </button>

        <button
            id="nextChapterButton"
            aria-label="Next song">

            ↓

        </button>

    </footer>



    <!--==================================================
    FULLSCREEN
    ==================================================-->

    <button
        id="fullscreenButton"
        aria-label="Toggle fullscreen">

        ⛶

    </button>



    <script src="script.js"></script>

</body>

</html>
